<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found · FitNyx</title>
  <link rel="icon" href="/favicon.png" />
  <!--
    Plain "not found" page. The old GitHub Pages SPA redirect that lived here
    (/x → /x/?p=/…) looped forever on Vercel, because every redirected URL was
    itself a 404 — broken links produced an endlessly growing URL. All real
    routes are prerendered, so a missing page is genuinely missing.
  -->
  <style>
    html,body{margin:0;height:100%;background:#08090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 20px;box-sizing:border-box}
    img{width:56px;height:56px;margin-bottom:28px}
    .code{font-size:13px;font-weight:700;letter-spacing:3px;color:#5fc793;margin:0 0 12px}
    h1{font-size:32px;line-height:1.2;margin:0 0 12px;letter-spacing:-.5px}
    p{color:#9aa0aa;font-size:16px;line-height:1.6;max-width:420px;margin:0 0 32px}
    .btn{display:inline-block;background:#5fc793;color:#0b0b10;text-decoration:none;font-weight:700;padding:14px 30px;border-radius:999px}
    .links{margin-top:28px;font-size:14px}
    .links a{color:#5fc793;text-decoration:none;margin:0 10px}
  </style>
</head>
<body>
  <main>
    <img src="https://res.cloudinary.com/dgdczfeox/image/upload/v1791728413/fitnyx-mark.png" alt="FitNyx" />
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has moved.</p>
    <a class="btn" href="/">Go to FitNyx</a>
    <div class="links"><a href="/blog">Blog</a><a href="/help">Help</a><a href="mailto:support@fitnyx.in">Contact</a></div>
  </main>
</body>
</html>
